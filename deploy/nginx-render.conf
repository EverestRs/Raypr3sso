# Raypr3sso 反向代理配置（设计 12 生产环境）：TLS 终止 + WebSocket
# 升级 + 请求体限制 + 超时。渲染服务只监听 127.0.0.1:9000。
#
#   sudo cp deploy/nginx-render.conf /etc/nginx/sites-available/render
#   sudo ln -s /etc/nginx/sites-available/render /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    server_name render.example.com;

    ssl_certificate     /etc/letsencrypt/live/render.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/render.example.com/privkey.pem;

    # 请求体限制（JSON 相机/渲染提交都很小）
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        # WebSocket（/api/sessions/{id}/events）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 事件连接是长连；普通 API 用 Connection: close
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;
        # 不缓存事件/预览
        proxy_buffering off;
        add_header X-Content-Type-Options nosniff always;
    }
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name render.example.com;
    return 301 https://$host$request_uri;
}
